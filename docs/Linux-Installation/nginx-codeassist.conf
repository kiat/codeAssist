# nginx site for CodeAssist. Install as /etc/nginx/conf.d/codeassist.conf
# and remove /etc/nginx/sites-enabled/default.
#
# Serves the built React app and forwards /api/* to the Flask backend on
# 127.0.0.1:5001 (the trailing slash in proxy_pass strips the /api prefix).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/codeassist/build;
    index index.html;

    # nginx defaults to 1 MB, which rejects most zip submissions.
    client_max_body_size 50M;

    location / {
        # Client-side routes (React Router) fall back to index.html.
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Autograder runs can take longer than the 60s default.
        proxy_read_timeout 300s;
    }
}
